name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file self-contained
        run: >
          dotnet publish src/GogglesUsb/GogglesUsb.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -o dist-single

      - name: Show size
        run: Get-ChildItem dist-single | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: GogglesUsb-singlefile-win-x64
          path: dist-single/GogglesUsb.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-single/GogglesUsb.exe
          body: |
            - `GogglesUsb.exe`：单文件自包含版（约 70 MB），目标电脑**不需要装 .NET 运行时**
            - 首次运行会在 exe 旁边自动下载 Sunshine 和转发器（约 70 MB），之后离线可用
            - 参数固定：1440×810 / 120fps / 20Mbps / H.264，一个按钮，关窗口全停