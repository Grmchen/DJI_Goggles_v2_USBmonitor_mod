name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/GogglesUsb/GogglesUsb.csproj -c Release

      - name: Stash self-test log
        run: |
          $exe = "src/GogglesUsb/bin/Release/net10.0-windows/GogglesUsb.exe"
          $env:GOGGLESUSB_HOME = "$env:RUNNER_TEMP\gu"
          Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -NoNewWindow
          Get-Content "$env:GOGGLESUSB_HOME\selftest.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: GogglesUsb-win-x64
          path: |
            src/GogglesUsb/bin/Release/net10.0-windows/GogglesUsb.exe
            src/GogglesUsb/bin/Release/net10.0-windows/GogglesUsb.dll
            src/GogglesUsb/bin/Release/net10.0-windows/GogglesUsb.deps.json
            src/GogglesUsb/bin/Release/net10.0-windows/GogglesUsb.runtimeconfig.json